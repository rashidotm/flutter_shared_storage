name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  analyze:
    name: Analyze Dart / Flutter packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to match local dev to avoid Dart-version drift
          # breaking fake_cloud_firestore's type overrides.
          # cloud_storage_gallery 1.0.0 needs >= 3.47 (material_ui).
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version

      - name: Activate melos
        run: dart pub global activate melos

      - name: Install workspace tooling
        # Installs the workspace's own melos. `--no-example`: a root
        # `pub get` also resolves `example/`, which can't resolve until
        # melos has written its path overrides.
        run: dart pub get --no-example

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Analyze
        run: melos run analyze-ci

      - name: Format check
        run: melos run format-check

  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to match local dev to avoid Dart-version drift
          # breaking fake_cloud_firestore's type overrides.
          # cloud_storage_gallery 1.0.0 needs >= 3.47 (material_ui).
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Activate melos
        run: dart pub global activate melos

      - name: Install workspace tooling
        # Installs the workspace's own melos. `--no-example`: a root
        # `pub get` also resolves `example/`, which can't resolve until
        # melos has written its path overrides.
        run: dart pub get --no-example

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Run test suite
        run: melos run test-ci
