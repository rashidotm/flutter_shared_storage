name: cloud_storage_firebase
description: Firebase Storage + Cloud Firestore implementation of cloud_storage_platform_interface. Caller-supplied paths, no uid assumption.
version: 0.1.2

homepage: https://github.com/rashidotm/flutter_shared_storage
repository: https://github.com/rashidotm/flutter_shared_storage/tree/master/packages/cloud_storage_firebase
issue_tracker: https://github.com/rashidotm/flutter_shared_storage/issues

topics:
  - cloud-storage
  - firebase
  - firestore
  - firebase-storage
  - file-manager

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_storage_platform_interface: ^0.1.2
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  firebase_storage: ^13.0.0
  cloud_firestore: ^6.0.0
  flutter_cache_manager: ^3.4.1
  path: ^1.9.0
  path_provider: ^2.1.6
  mime: ^2.0.0
  meta: ^1.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.1.1
  firebase_storage_mocks: ^0.8.1
  mocktail: ^1.0.4

# For monorepo development, always resolve the sibling package from the
# local source. `pub publish` ignores dependency_overrides — consumers on
# pub.dev pick up the version-based dep above.
dependency_overrides:
  cloud_storage_platform_interface:
    path: ../cloud_storage_platform_interface
  # cloud_firestore 6.7.0 changed WriteBatch.update to a generic
  # signature that the latest fake_cloud_firestore (4.1.1) doesn't
  # match — compilation fails in tests. Pin to <6.7.0 in the
  # workspace only; published consumers keep the ^6.0.0 range from
  # `dependencies:` above. Remove once fake_cloud_firestore ships a
  # compatible release.
  cloud_firestore: ">=6.0.0 <6.7.0"
  # firebase_storage 13.4.4 references a `FirebasePlugin` type that
  # isn't in our firebase_core version. Same workspace-only pin;
  # published consumers keep the ^13.0.0 range from above.
  firebase_storage: ">=13.0.0 <13.4.4"
