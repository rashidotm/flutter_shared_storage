name: cloud_storage_firebase
description: Firebase Storage + Firestore implementation of cloud_storage_platform_interface.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_storage_platform_interface:
    path: ../cloud_storage_platform_interface
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_storage: ^12.3.2
  cloud_firestore: ^5.4.4
  flutter_cache_manager: ^3.4.1
  path: ^1.9.0
  path_provider: ^2.1.4
  mime: ^1.0.6
  meta: ^1.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
