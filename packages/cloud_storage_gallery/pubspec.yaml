name: cloud_storage_gallery
description: Drop-in Flutter widgets for browsing folders, viewing media, uploading with progress, and thumbnail generation on top of cloud_storage.
version: 0.7.0

homepage: https://github.com/rashidotm/flutter_shared_storage
repository: https://github.com/rashidotm/flutter_shared_storage/tree/master/packages/cloud_storage_gallery
issue_tracker: https://github.com/rashidotm/flutter_shared_storage/issues

topics:
  - cloud-storage
  - file-manager
  - gallery
  - photo-viewer
  - video-player

environment:
  # fc_native_video_thumbnail 4, video_player 2.14 and chewie 1.17 all
  # require Dart 3.12 / Flutter 3.44.
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cloud_storage_platform_interface: ^0.1.2
  # Kept on 3.x: every cached_network_image 4.x depends on material_ui.
  # This line stays on package:flutter/material.dart so host apps that
  # haven't migrated don't get mixed Material types.
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  video_player: ^2.14.1
  # chewie 1.18.0+ depends on material_ui; stay below it (see above).
  chewie: ">=1.13.0 <1.18.0"
  flutter_cache_manager: ^3.4.1
  # Full-featured folder browser deps:
  file_picker: ^13.4.0
  share_plus: ^13.3.1
  image: ^4.13.1
  fc_native_video_thumbnail: ^4.0.0
  mime: ^2.1.0
  path: ^1.9.0
  path_provider: ^2.1.6
  open_filex: ^5.0.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Fakes for the native thumbnailer / temp dir in thumbnail tests.
  plugin_platform_interface: ^2.1.8
  path_provider_platform_interface: ^2.1.2

flutter:
  # `chewie` (transitive) sets uses-material-design: true. Not
  # opting-in on our side surfaces a pub warning that CI treats as
  # an error.
  uses-material-design: true

dependency_overrides:
  cloud_storage_platform_interface:
    path: ../cloud_storage_platform_interface
