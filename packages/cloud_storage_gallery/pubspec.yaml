name: cloud_storage_gallery
description: Ready-made widgets for browsing folders, viewing media, uploading with progress, and generating thumbnails on top of cloud_storage.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_storage_platform_interface:
    path: ../cloud_storage_platform_interface
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  video_player: ^2.9.2
  chewie: ^1.8.5
  flutter_cache_manager: ^3.4.1
  # Full-featured folder browser deps:
  file_picker: ^8.1.2
  share_plus: ^10.1.2
  open_filex: ^4.5.0
  url_launcher: ^6.3.1
  image: ^4.3.0
  video_thumbnail: ^0.5.3
  mime: ^1.0.6
  path: ^1.9.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
