name: cloud_storage_gallery
description: Drop-in Flutter widgets for browsing folders, viewing media, uploading with progress, and thumbnail generation on top of cloud_storage.
version: 0.6.0

homepage: https://github.com/rashidotm/flutter_shared_storage
repository: https://github.com/rashidotm/flutter_shared_storage/tree/master/packages/cloud_storage_gallery
issue_tracker: https://github.com/rashidotm/flutter_shared_storage/issues

topics:
  - cloud-storage
  - file-manager
  - gallery
  - photo-viewer
  - video-player

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cloud_storage_platform_interface: ^0.1.2
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  video_player: ^2.9.2
  chewie: ^1.13.0
  flutter_cache_manager: ^3.4.1
  # Full-featured folder browser deps:
  file_picker: ^11.0.0
  share_plus: ^11.0.0
  image: ^4.3.0
  video_thumbnail: ^0.5.3
  mime: ^2.0.0
  path: ^1.9.0
  path_provider: ^2.1.6
  open_filex: ^4.5.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # `chewie` (transitive) sets uses-material-design: true. Not
  # opting-in on our side surfaces a pub warning that CI treats as
  # an error.
  uses-material-design: true

dependency_overrides:
  cloud_storage_platform_interface:
    path: ../cloud_storage_platform_interface
