name: cloud_storage
description: Cloud file/folder storage for Flutter — umbrella package re-exporting the interface and the default Firebase implementation.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_storage_platform_interface:
    path: ../cloud_storage_platform_interface
  cloud_storage_firebase:
    path: ../cloud_storage_firebase

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
