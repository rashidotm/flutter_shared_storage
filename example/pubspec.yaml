name: cloud_storage_example
description: Example app for the flutter_shared_storage monorepo.
version: 0.1.1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cloud_storage:
    path: ../packages/cloud_storage
  cloud_storage_gallery:
    path: ../packages/cloud_storage_gallery
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
