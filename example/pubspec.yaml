name: cloud_storage_example
description: Example app for the flutter_shared_storage monorepo.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_storage:
    path: ../packages/cloud_storage
  cloud_storage_gallery:
    path: ../packages/cloud_storage_gallery
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  file_picker: ^8.1.2
  share_plus: ^10.1.2
  image: ^4.3.0
  video_thumbnail: ^0.5.3
  mime: ^1.0.6
  path: ^1.9.0
  path_provider: ^2.1.5
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
